name: Simulator tests and screenshots

# Runs the unit tests on an iOS simulator, then launches each main screen with
# demo data in light and dark mode and publishes screenshots + test results.

on:
  push:
    branches: [main, "ccr-*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project MoonMoney.xcodeproj -scheme MoonMoney -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Debug-iphonesimulator/MoonMoney.app/Info.plist

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted([k for k in devices if "iOS-26" in k], reverse=True)
          pool = [d for k in ios for d in devices[k] if d["name"].startswith("iPhone")]
          pro = [d for d in pool if "Pro" in d["name"] and "Max" not in d["name"]]
          print((pro or pool)[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/MoonMoney.app

      - name: Run unit tests
        run: |
          mkdir -p shots
          set +e
          xcodebuild test -project MoonMoney.xcodeproj -scheme MoonMoney -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log > /dev/null
          echo "${PIPESTATUS[0]}" > test-exit-code
          grep -E "✔|✘|Test run with|error:|failed|passed" test.log | grep -v "^\s*$" | tail -150 > shots/tests.txt
          cat shots/tests.txt | tail -40

      - name: Capture screens
        run: |
          mkdir -p shots
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for screen in home stats assets me entry ai map places alerts; do
              xcrun simctl terminate "$UDID" com.moonmoney.app 2>/dev/null || true
              xcrun simctl launch "$UDID" com.moonmoney.app -demoData -screen "$screen"
              if [ "$screen" = "places" ]; then sleep 14; else sleep 8; fi
              xcrun simctl io "$UDID" screenshot "shots/${mode}-${screen}.png"
            done
          done
          # Pixel skin
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for screen in home stats entry me; do
              xcrun simctl terminate "$UDID" com.moonmoney.app 2>/dev/null || true
              xcrun simctl launch "$UDID" com.moonmoney.app -demoData -skin pixel -screen "$screen"
              sleep 8
              xcrun simctl io "$UDID" screenshot "shots/pixel-${mode}-${screen}.png"
            done
          done
          xcrun simctl terminate "$UDID" com.moonmoney.app 2>/dev/null || true
          xcrun simctl launch "$UDID" com.moonmoney.app -skin liquid
          sleep 3
          ls -la shots

      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots --yes --cleanup-tag 2>/dev/null || true
          gh release create screenshots shots/*.png shots/tests.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "模拟器截图（自动生成）" \
            --notes "commit ${GITHUB_SHA::7} 的模拟器截图，浅色与深色模式。"

      - name: Fail if tests failed
        run: |
          code=$(cat test-exit-code 2>/dev/null || echo 1)
          if [ "$code" != "0" ]; then echo "Unit tests failed (exit $code)"; exit 1; fi
