name: Build unsigned IPA

on:
  push:
    branches: [main, "ccr-*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project MoonMoney.xcodeproj \
            -scheme MoonMoney \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Release-iphoneos/MoonMoney.app/Info.plist

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MoonMoney.app Payload/
          # Info.plist first so signing tools find the app even in a partial download.
          zip -qX MoonMoney-unsigned.ipa Payload/ Payload/MoonMoney.app/ Payload/MoonMoney.app/Info.plist
          zip -qrX MoonMoney-unsigned.ipa Payload -x Payload/MoonMoney.app/Info.plist
          unzip -tq MoonMoney-unsigned.ipa
          ls -lh MoonMoney-unsigned.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/MoonMoney.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Payload/MoonMoney.app/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          cp MoonMoney-unsigned.ipa "MoonMoney-${VERSION}.ipa"
          # Lite build without the widget extension: easier to sign with a free Apple ID.
          rm -rf Payload/MoonMoney.app/PlugIns
          zip -qX "MoonMoney-${VERSION}-lite.ipa" Payload/ Payload/MoonMoney.app/ Payload/MoonMoney.app/Info.plist
          zip -qrX "MoonMoney-${VERSION}-lite.ipa" Payload -x Payload/MoonMoney.app/Info.plist
          unzip -tq "MoonMoney-${VERSION}-lite.ipa"
          echo "Version $VERSION ($BUILD)"

      - uses: actions/upload-artifact@v4
        with:
          name: MoonMoney-unsigned-ipa
          path: MoonMoney-unsigned.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release per marketing version (e.g. v1.0), refreshed with each new build.
          TAG="v${VERSION}"
          # Never delete the release: replacing assets in place keeps download links alive.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest --title "MoonMoney ${VERSION}" --notes "MoonMoney ${VERSION}"
          fi
          gh release upload "$TAG" "MoonMoney-${VERSION}.ipa" "MoonMoney-${VERSION}-lite.ipa" --clobber
          gh release edit "$TAG" --latest --title "MoonMoney ${VERSION}" --notes "MoonMoney ${VERSION}（构建 ${BUILD}，commit ${GITHUB_SHA::7}）。

          未签名 IPA，需用 AltStore / SideStore / 爱思助手 / TrollStore 等工具自签后安装，系统要求 iOS 26。

          - MoonMoney-${VERSION}.ipa：完整版（含桌面小组件、控制中心按钮）
          - MoonMoney-${VERSION}-lite.ipa：精简版（不含小组件），免费 Apple ID 签名更容易成功

          如果手机上装过 2.0 版本，请先在「我的 → 数据管理」导出备份，删除旧 App 后再安装。"
