name: Build unsigned IPA

on:
  push:
    branches: [main, "ccr-*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project MoonMoney.xcodeproj \
            -scheme MoonMoney \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Release-iphoneos/MoonMoney.app/Info.plist

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MoonMoney.app Payload/
          zip -qry MoonMoney-unsigned.ipa Payload
          ls -lh MoonMoney-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MoonMoney-unsigned-ipa
          path: MoonMoney-unsigned.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" MoonMoney-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "MoonMoney 未签名 IPA #${GITHUB_RUN_NUMBER}" \
            --notes "未签名构建（commit ${GITHUB_SHA::7}）。需用 AltStore / SideStore / 爱思助手 / TrollStore 等工具自签后安装，系统要求 iOS 26。"
