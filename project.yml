# Optional: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`).
name: MoonMoney
options:
  bundleIdPrefix: com.moonmoney
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
targets:
  MoonMoney:
    type: application
    platform: iOS
    sources: [MoonMoney]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moonmoney.app
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: MoonMoney
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: 使用面容 ID 解锁 MoonMoney，保护你的账目隐私。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
